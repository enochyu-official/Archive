{{ define "main" }}
<header class="page-header">
  <h1>Computer Science</h1>
</header>
<section class="list-container">
  <table class="list">
    <thead>
      <tr>
        <th class="list-no">No.</th>
        <th>Title</th>
        <th>Access</th>
        <th>Author</th>
        <th>Date</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      {{ $number := len hugo.Data.B.items }}
      {{ range hugo.Data.B.items }}
        <tr>
          <td class="list-no">{{ $number }}.</td>
          <td>{{ .title }}</td>
          <td>{{ .access }}</td>
          <td>{{ .author }}</td>
          <td>{{ .date }}</td>
          <td>{{ .category }}</td>
        </tr>
        {{ $number = sub $number 1 }}
      {{ end }}
    </tbody>
  </table>
</section>
{{ end }}
