<!DOCTYPE html>
<html lang="{{ .Language.Params.locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  <footer class="footer">
    <div>
      <a href="https://enochyu.com/" target="_blank" rel="noopener noreferrer">
        &copy; {{ now.Year }} {{ .Site.Params.author }}. All Rights Reserved.
      </a>
    </div>
  </footer>
  
  {{ $script := resources.Get "js/script.js" }}
  <script src="{{ $script.RelPermalink }}"></script>
  {{ $counter := resources.Get "js/counter.js" }}
  <script src="{{ $counter.RelPermalink }}"></script>
</body>
</html>
