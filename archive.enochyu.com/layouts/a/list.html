{{ define "main" }}
<header class="page-header">
  <h1>Mathematics</h1>
</header>
<section class="list-container">
  <table class="list">
    <colgroup>
      <col style="width: 5%">
      <col style="width: 35%">
      <col style="width: 15%">
      <col style="width: 15%">
      <col style="width: 15%">
      <col style="width: 15%">
    </colgroup>
    <thead>
      <tr>
        <th class="list-right">No.</th>
        <th>Title</th>
        <th>Access</th>
        <th class="list-right">Author</th>
        <th class="list-right">Date</th>
        <th class="list-right">Category</th>
      </tr>
    </thead>
    <tbody>
      {{ $number := len hugo.Data.A.items }}
      {{ range hugo.Data.A.items }}
        <tr>
          <td class="list-right">{{ $number }}.</td>
          <td>{{ .title }}</td>
          <td>
            <a href="{{ .access1 }}">PDF</a>,
            <a href="{{ .access2 }}">Source (Git)</a>
          </td>
          <td class="list-right">{{ .author }}</td>
          <td class="list-right">{{ .date }}</td>
          <td class="list-right">{{ .category }}</td>
        </tr>
        {{ $number = sub $number 1 }}
      {{ end }}
    </tbody>
  </table>
</section>
{{ end }}
